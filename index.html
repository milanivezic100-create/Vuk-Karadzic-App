<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f1e7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="VUK Probe"
  >

  <title>VUK Karadžić Probe</title>

  <link
    rel="apple-touch-icon"
    href="Vuk-app-icon.png"
  >

  <!-- V12 STYLES -->
  <link
    rel="stylesheet"
    href="styles.css?v=12"
  >

</head>


<body>

  <div id="app">


    <!-- ======================================================
         HEADER
         ====================================================== -->

    <header class="top-header">

      <div class="brand">

        <img
          src="Vuk-logo.png"
          alt="VUK Karadžić"
          class="vuk-logo"
        >

        <div class="brand-title">
          Probe
        </div>

      </div>


      <button
        id="ensembleButton"
        class="ensemble-pill"
        type="button"
        aria-hidden="true"
        tabindex="-1"
      >
        Ensemble
      </button>

    </header>



    <!-- ======================================================
         HOME
         ====================================================== -->

    <main
      id="homePage"
      class="page active"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Ensembles
        </h1>

      </div>


      <div
        id="ensembleList"
        class="ensemble-list"
      ></div>

    </main>



    <!-- ======================================================
         CALENDAR
         ====================================================== -->

    <main
      id="calendarPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Calendar
        </h1>

        <p id="calendarEnsemble"></p>

      </div>


      <button
        id="todayButton"
        class="today-button"
        type="button"
      >
        Today
      </button>


      <section class="calendar-card">

        <div class="calendar-header">

          <button
            class="calendar-arrow"
            id="calendarPrev"
            type="button"
            data-direction="prev"
            aria-label="Previous month"
          >
            ‹
          </button>


          <h2 id="calendarMonth"></h2>


          <button
            class="calendar-arrow"
            id="calendarNext"
            type="button"
            data-direction="next"
            aria-label="Next month"
          >
            ›
          </button>

        </div>


        <div class="weekdays">

          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>

        </div>


        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>

      </section>


      <div class="practice-heading-row">

        <h2 class="practice-heading">
          Practices
        </h2>


        <button
          id="addPracticeButton"
          class="round-add"
          type="button"
          aria-label="Add practice"
        >
          +
        </button>

      </div>


      <div
        id="practiceList"
        class="stack-list"
      ></div>

    </main>



    <!-- ======================================================
         DANCES
         ====================================================== -->

    <main
      id="dancesPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Dances
        </h1>

        <p id="danceEnsemble"></p>

      </div>


      <button
        id="addDanceButton"
        class="round-add"
        type="button"
        aria-label="Add dance"
      >
        +
      </button>


      <div id="danceList"></div>

    </main>



    <!-- ======================================================
         DANCERS
         ====================================================== -->

    <main
      id="dancersPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Dancers
        </h1>

        <p id="dancerEnsemble"></p>

      </div>


      <button
        id="addDancerButton"
        class="round-add"
        type="button"
        aria-label="Add dancer"
      >
        +
      </button>


      <div class="search-box">

        <span aria-hidden="true">
          ⌕
        </span>

        <input
          id="dancerSearch"
          type="search"
          placeholder="Search dancers..."
          autocomplete="off"
          autocorrect="off"
        >

      </div>


      <div id="dancerList"></div>

    </main>



    <!-- ======================================================
         SETTINGS
         ====================================================== -->

    <main
      id="settingsPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Settings
        </h1>

        <p id="settingsEnsemble"></p>

      </div>


      <section class="settings-section">

        <h2 class="settings-section-heading">
          SHARED
        </h2>


        <div class="settings-card">

          <button
            id="instructorNotesButton"
            type="button"
          >

            <span>
              Instructor Notes
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>

        </div>

      </section>


      <section class="settings-section">

        <h2 class="settings-section-heading">
          APP SETTINGS
        </h2>


        <div class="settings-card">

          <button
            id="manageEnsembles"
            type="button"
          >

            <span>
              Manage Ensembles
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>


          <button
            id="accountsButton"
            type="button"
          >

            <span>
              Instructor Accounts
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>


          <button
            id="permissionsButton"
            type="button"
          >

            <span>
              Permissions
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>

        </div>

      </section>

    </main>



    <!-- ======================================================
         BOTTOM NAVIGATION
         ====================================================== -->

    <nav class="bottom-nav">


      <button
        class="nav-button"
        type="button"
        data-page="calendarPage"
        aria-label="Calendar"
      >

        <span class="nav-icon">
          ▣
        </span>

        <span>
          Calendar
        </span>

      </button>



      <button
        class="nav-button"
        type="button"
        data-page="dancesPage"
        aria-label="Dances"
      >

        <span class="nav-icon">
          ♪
        </span>

        <span>
          Dances
        </span>

      </button>



      <button
        class="nav-button home-nav active"
        type="button"
        data-page="homePage"
        aria-label="Home"
      >

        <span class="nav-icon home-circle">
          ⌂
        </span>

        <span>
          Home
        </span>

      </button>



      <button
        class="nav-button"
        type="button"
        data-page="dancersPage"
        aria-label="Dancers"
      >

        <span class="nav-icon">
          ♙
        </span>

        <span>
          Dancers
        </span>

      </button>



      <button
        class="nav-button"
        type="button"
        data-page="settingsPage"
        aria-label="Settings"
      >

        <span class="nav-icon">
          ⚙️
        </span>

        <span>
          Settings
        </span>

      </button>

    </nav>

  </div>



  <!-- ========================================================
       MODAL
       ======================================================== -->

  <div
    id="modalOverlay"
    class="modal-overlay"
    aria-hidden="true"
  >

    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
    >

      <header class="modal-header">


        <button
          id="modalBack"
          class="modal-back hidden"
          type="button"
        >
          ‹ Back
        </button>


        <div class="modal-title-area">

          <div id="modalEyebrow"></div>

          <h2 id="modalTitle"></h2>

        </div>


        <button
          id="closeModal"
          class="close-button"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </header>


      <div id="modalBody"></div>

    </section>

  </div>



  <!-- ========================================================
       TOAST
       ======================================================== -->

  <div
    id="appToast"
    class="app-toast"
    role="status"
    aria-live="polite"
  ></div>



  <!-- ========================================================
       UPLOAD OVERLAY
       ======================================================== -->

  <div
    id="uploadOverlay"
    class="upload-overlay"
    aria-hidden="true"
  >

    <div class="upload-box">


      <div
        class="upload-spinner"
        aria-hidden="true"
      ></div>


      <strong id="uploadMessage">
        Uploading...
      </strong>


      <button
        id="cancelUploadButton"
        class="upload-cancel-button"
        type="button"
      >
        Cancel
      </button>

    </div>

  </div>



  <!-- ========================================================
       FIREBASE
       ======================================================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


    import {
      getDatabase,
      ref as dbRef,
      set,
      update,
      remove,
      push,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    import {
      getStorage,
      ref as storageRef,
      uploadBytes,
      getDownloadURL,
      deleteObject
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBHpQLmdhBoImJorhBrQhSHHwml1XEEuso",

      authDomain:
        "vuk-probe.firebaseapp.com",

      databaseURL:
        "https://vuk-probe-default-rtdb.firebaseio.com",

      projectId:
        "vuk-probe",

      storageBucket:
        "vuk-probe.firebasestorage.app",

      messagingSenderId:
        "895894448380",

      appId:
        "1:895894448380:web:7f576b91e7da1da562cf79"
    };


    const firebaseApp =
      initializeApp(
        firebaseConfig
      );


    const database =
      getDatabase(
        firebaseApp
      );


    const storage =
      getStorage(
        firebaseApp
      );


    window.vukFirebase = {

      database,

      dbRef,

      set,

      update,

      remove,

      push,

      onValue,

      storage,

      storageRef,

      uploadBytes,

      getDownloadURL,

      deleteObject

    };


    window.dispatchEvent(
      new Event(
        "vukFirebaseReady"
      )
    );

  </script>



  <!-- ========================================================
       V11 JAVASCRIPT
       ======================================================== -->

  <script
    src="script.js?v=11"
    defer
  ></script>


</body>

</html>
