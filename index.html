<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f1e7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="VUK Probe"
  >

  <title>VUK Karadžić Probe</title>

  <link
    rel="apple-touch-icon"
    href="Vuk-app-icon.png"
  >

  <!-- v8 forces iPhone to load the newest CSS -->
  <link
    rel="stylesheet"
    href="styles.css?v=8"
  >
</head>

<body>

  <div id="app">

    <!-- ======================================================
         HEADER
         ====================================================== -->

    <header class="top-header">

      <div class="brand">

        <img
          src="Vuk-logo.png"
          alt="VUK"
          class="vuk-logo"
        >

        <div class="brand-title">
          Probe
        </div>

      </div>

      <!--
        Kept for JavaScript compatibility.
        Hidden visually.
        Ensemble switching happens from Home.
      -->

      <button
        type="button"
        id="ensembleButton"
        class="ensemble-pill"
        aria-hidden="true"
      >
        Ensemble
      </button>

    </header>


    <!-- ======================================================
         HOME
         ====================================================== -->

    <main
      id="homePage"
      class="page active"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Ensembles
        </h1>

        <p>
          Choose an ensemble
        </p>

      </div>

      <div
        id="ensembleList"
        class="ensemble-list"
      ></div>

    </main>


    <!-- ======================================================
         CALENDAR
         ====================================================== -->

    <main
      id="calendarPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Calendar
        </h1>

        <p id="calendarEnsemble"></p>

      </div>


      <button
        type="button"
        id="todayButton"
        class="today-button"
      >
        Today
      </button>


      <div class="calendar-card">

        <div class="calendar-header">

          <button
            type="button"
            class="calendar-arrow"
            data-direction="prev"
            aria-label="Previous month"
          >
            ‹
          </button>


          <h2 id="calendarMonth"></h2>


          <button
            type="button"
            class="calendar-arrow"
            data-direction="next"
            aria-label="Next month"
          >
            ›
          </button>

        </div>


        <div class="weekdays">

          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>

        </div>


        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>

      </div>


      <div class="practice-heading-row">

        <h2 class="practice-heading">
          Practices
        </h2>


        <button
          type="button"
          id="addPracticeButton"
          class="round-add"
          aria-label="Add practice"
        >
          +
        </button>

      </div>


      <div
        id="practiceList"
        class="stack-list"
      ></div>

    </main>


    <!-- ======================================================
         DANCES
         ====================================================== -->

    <main
      id="dancesPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Dances
        </h1>

        <p id="danceEnsemble"></p>

      </div>


      <button
        type="button"
        id="addDanceButton"
        class="round-add"
        aria-label="Add dance"
      >
        +
      </button>


      <!--
        Kept for JavaScript compatibility.
        No helper text is displayed.
      -->

      <p
        class="reorder-hint"
        aria-hidden="true"
      ></p>


      <div id="danceList"></div>

    </main>


    <!-- ======================================================
         DANCERS
         ====================================================== -->

    <main
      id="dancersPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Dancers
        </h1>

        <p id="dancerEnsemble"></p>

      </div>


      <button
        type="button"
        id="addDancerButton"
        class="round-add"
        aria-label="Add dancer"
      >
        +
      </button>


      <div class="search-box">

        <span>⌕</span>

        <input
          type="search"
          id="dancerSearch"
          placeholder="Search dancers..."
          autocomplete="off"
        >

      </div>


      <!--
        Kept for JavaScript compatibility.
        No helper text is displayed.
      -->

      <p
        class="roster-help"
        aria-hidden="true"
      ></p>


      <div id="dancerList"></div>

    </main>


    <!-- ======================================================
         SETTINGS
         ====================================================== -->

    <main
      id="settingsPage"
      class="page"
    >

      <div class="page-intro">

        <h1 class="section-heading">
          Settings
        </h1>

        <p id="settingsEnsemble"></p>

      </div>


      <section class="settings-section">

        <h2 class="settings-section-heading">
          INSTRUCTOR
        </h2>


        <!--
          JavaScript turns this into the
          Instructor Notes settings row.
        -->

        <div class="instructor-notes-card"></div>

      </section>


      <section class="settings-section">

        <h2 class="settings-section-heading">
          ENSEMBLE
        </h2>


        <div class="settings-card">

          <button
            type="button"
            id="manageEnsembles"
          >

            <span>
              Manage Ensembles
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>


          <button
            type="button"
            id="accountsButton"
          >

            <span>
              Instructor Accounts
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>


          <button
            type="button"
            id="permissionsButton"
          >

            <span>
              Permissions
            </span>

            <span class="settings-chevron">
              ›
            </span>

          </button>

        </div>

      </section>


      <p
        class="settings-note"
        aria-hidden="true"
      ></p>

    </main>


    <!-- ======================================================
         BOTTOM NAVIGATION
         ====================================================== -->

    <nav class="bottom-nav">

      <button
        type="button"
        class="nav-button"
        data-page="calendar"
      >

        <span class="nav-icon">
          ▣
        </span>

        <span>
          Calendar
        </span>

      </button>


      <button
        type="button"
        class="nav-button"
        data-page="dances"
      >

        <span class="nav-icon">
          ♪
        </span>

        <span>
          Dances
        </span>

      </button>


      <button
        type="button"
        class="nav-button home-nav active"
        data-page="home"
      >

        <span class="nav-icon home-circle">
          ⌂
        </span>

        <span>
          Home
        </span>

      </button>


      <button
        type="button"
        class="nav-button"
        data-page="dancers"
      >

        <span class="nav-icon">
          ♙
        </span>

        <span>
          Dancers
        </span>

      </button>


      <button
        type="button"
        class="nav-button"
        data-page="settings"
      >

        <span class="nav-icon">
          ⚙️
        </span>

        <span>
          Settings
        </span>

      </button>

    </nav>

  </div>


  <!-- ========================================================
       MODAL
       ======================================================== -->

  <div
    id="modalOverlay"
    class="modal-overlay"
    aria-hidden="true"
  >

    <div class="modal">

      <div class="modal-header">

        <button
          type="button"
          id="modalBack"
          class="modal-back hidden"
        >
          ‹ Back
        </button>


        <div class="modal-title-area">

          <div id="modalEyebrow"></div>

          <h2 id="modalTitle"></h2>

        </div>


        <button
          type="button"
          id="closeModal"
          class="close-button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div id="modalBody"></div>

    </div>

  </div>


  <!-- ========================================================
       TOAST
       ======================================================== -->

  <div
    id="appToast"
    class="app-toast"
  ></div>


  <!-- ========================================================
       UPLOAD OVERLAY
       ======================================================== -->

  <div
    id="uploadOverlay"
    class="upload-overlay"
    aria-hidden="true"
  >

    <div class="upload-box">

      <div class="upload-spinner"></div>

      <strong id="uploadMessage">
        Uploading...
      </strong>


      <button
        type="button"
        id="cancelUploadButton"
        class="upload-cancel-button"
      >
        Cancel
      </button>

    </div>

  </div>


  <!-- ========================================================
       FIREBASE
       ======================================================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


    import {
      getDatabase,
      ref as dbRef,
      set,
      update,
      remove,
      push,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    import {
      getStorage,
      ref as storageRef,
      uploadBytes,
      getDownloadURL,
      deleteObject
    } from
      "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBHpQLmdhBoImJorhBrQhSHHwml1XEEuso",

      authDomain:
        "vuk-probe.firebaseapp.com",

      databaseURL:
        "https://vuk-probe-default-rtdb.firebaseio.com",

      projectId:
        "vuk-probe",

      storageBucket:
        "vuk-probe.firebasestorage.app",

      messagingSenderId:
        "895894448380",

      appId:
        "1:895894448380:web:7f576b91e7da1da562cf79"

    };


    const firebaseApp =
      initializeApp(
        firebaseConfig
      );


    const database =
      getDatabase(
        firebaseApp
      );


    const storage =
      getStorage(
        firebaseApp
      );


    window.vukFirebase = {

      database,
      dbRef,
      set,
      update,
      remove,
      push,
      onValue,

      storage,
      storageRef,
      uploadBytes,
      getDownloadURL,
      deleteObject

    };


    window.dispatchEvent(
      new Event(
        "vukFirebaseReady"
      )
    );

  </script>


  <!--
    v8 forces iPhone to load the newest JavaScript
  -->

  <script src="script.js?v=8"></script>

</body>
</html>
